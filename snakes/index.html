<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#2B2440" />
  <meta name="description" content="Multiplayer snake for up to 8. Eat, grow, boost, don't crash." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Snakes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud" class="screen hidden">
      <div class="hud-top">
        <div id="hud-time">60</div>
        <div id="hud-bars" class="hud-bars"></div>
      </div>
      <div id="joy" class="joy hidden"><div class="joy-base"></div><div class="joy-knob"></div></div>
      <button id="btn-dash" class="dash">BOOST</button>
      <div id="hud-hint" class="hud-hint"></div>
    </div>

    <!-- Menu -->
    <div id="menu" class="screen">
      <a id="btn-hub" class="hub-link" href="../">‹ Arcade</a>
      <div class="title">Snakes</div>
      <p class="tagline" data-i18n="tagline">Snakes vs snakes. Eat, grow, don't crash.</p>
      <div class="me-row">
        <canvas id="me-preview" width="72" height="72"></canvas>
        <input id="name-input" maxlength="12" placeholder="Your name" data-i18n-ph="yourName" autocomplete="off" />
      </div>
      <div id="color-row" class="color-row"></div>
      <button id="btn-solo" class="big" data-i18n="playBots">Play vs bots</button>
      <button id="btn-create" class="big alt" data-i18n="createRoom">Create room</button>
      <div class="join-row">
        <input id="code-input" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off" />
        <button id="btn-join" data-i18n="joinRoom">Join</button>
      </div>
      <div class="menu-row">
        <button id="btn-shop" data-i18n="shop">Shop</button>
        <button id="btn-missions"><span data-i18n="missions">Missions</span> <b id="missions-badge"></b></button>
        <div class="coins-wallet"><span class="coin"></span><span id="menu-coins">0</span></div>
      </div>
      <div id="menu-stats" class="stats"></div>
      <div class="menu-foot">
        <button id="btn-sound" class="ghost">Sound: on</button>
        <button id="btn-vibrate" class="ghost">Vibration: on</button>
        <button id="btn-lang" class="ghost">Čeština</button>
      </div>
    </div>

    <!-- Lobby -->
    <div id="lobby" class="screen panel hidden">
      <div class="panel-head">
        <button id="btn-leave" class="back">‹</button>
        <h2 data-i18n="lobby">Místnost</h2>
        <div id="lobby-kind" class="kind"></div>
      </div>
      <div id="code-box" class="code-box">
        <div id="lobby-code" class="code">ABCD</div>
        <div class="code-actions">
          <button id="btn-copy" data-i18n="copyLink">Kopírovat odkaz</button>
          <button id="btn-share-room" data-i18n="share">Sdílet</button>
        </div>
      </div>
      <div id="settings-box" class="settings-box">
        <div class="set-row"><span data-i18n="mode">Mód</span><div id="mode-btns" class="seg"></div></div>
        <div id="mode-desc" class="lb-status"></div>
        <div class="set-row"><span data-i18n="length">Length</span><div id="len-btns" class="seg"></div></div>
        <div class="set-row" id="target-row"><span data-i18n="target">Target</span><div id="target-btns" class="seg"></div></div>
        <div class="set-row"><span data-i18n="abilities">Abilities</span><div id="pu-btns" class="seg"></div></div>
        <div class="set-row"><span data-i18n="bots">Bots</span><div id="bots-btns" class="seg"></div></div>
      </div>
      <div id="lobby-count" class="lb-status"></div>
      <div id="lobby-list" class="lobby-list"></div>
      <div id="lobby-host-actions" class="menu-row hidden">
        <button id="btn-bots" data-i18n="fillBots">Doplnit boty</button>
        <button id="btn-start" class="big" data-i18n="start">Start</button>
      </div>
      <div id="lobby-wait" class="lb-status hidden" data-i18n="waitingHost">Čekej, až hostitel odstartuje…</div>
    </div>

    <!-- Výsledky -->
    <div id="results" class="screen hidden">
      <div id="res-title" class="res-title"></div>
      <div id="res-list" class="res-list"></div>
      <div id="res-coins" class="res-coins"></div>
      <button id="btn-double" class="big alt hidden"><span data-i18n="doubleAd">Zdvojnásobit za reklamu</span></button>
      <div class="menu-row">
        <button id="btn-again" class="big" data-i18n="again">Znovu</button>
        <button id="btn-res-menu" data-i18n="backMenu">Menu</button>
      </div>
      <div id="res-wait" class="lb-status hidden" data-i18n="waitNext">Čekej na další kolo…</div>
    </div>

    <!-- Úkoly -->
    <div id="missions" class="screen panel hidden">
      <div class="panel-head">
        <button class="back" data-back>‹</button>
        <h2 data-i18n="missions">Úkoly</h2>
      </div>
      <div class="shop-section" data-i18n="dailyT">Denní</div>
      <div id="daily-list" class="missions-list"></div>
      <div class="shop-section" data-i18n="weeklyT">Týdenní</div>
      <div id="weekly-list" class="missions-list"></div>
    </div>

    <!-- Obchod -->
    <div id="shop" class="screen panel hidden">
      <div class="panel-head">
        <button class="back" data-back>‹</button>
        <h2 data-i18n="shop">Obchod</h2>
        <div class="coins-wallet"><span class="coin"></span><span id="shop-coins">0</span></div>
      </div>
      <div class="shop-section" data-i18n="hats">Klobouky</div>
      <div id="hat-grid" class="hat-grid"></div>
      <div class="shop-section" data-i18n="patterns">Vzory</div>
      <div id="pat-grid" class="hat-grid"></div>
      <div class="shop-section" data-i18n="purchases">Nákupy</div>
      <div class="iap-list">
        <button class="iap" data-iap="remove_ads"><span data-i18n="removeAds">Bez reklam</span><b id="price-remove_ads">€3.99/měsíc</b></button>
        <button class="iap" data-iap="coins_500"><span id="lbl-coins_500">500 mincí</span><b id="price-coins_500">€1.99</b></button>
        <button class="iap" data-iap="coins_2000"><span id="lbl-coins_2000">2 000 mincí</span><b id="price-coins_2000">€5.99</b></button>
      </div>
      <button id="btn-restore" class="ghost" data-i18n="restore">Obnovit nákupy</button>
      <div id="iap-note" class="iap-note hidden" data-i18n="stripeNote"></div>
    </div>

    <div id="banner" class="hidden" data-i18n="banner">reklamní banner</div>
    <div id="toast" class="hidden"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/audio.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/render.js"></script>
  <script src="js/net.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/monetization.js"></script>
  <script src="../rating.js"></script><script src="js/main.js"></script>
</body>
</html>
