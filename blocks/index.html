<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" /><meta name="theme-color" content="#1B1030" />
  <meta name="description" content="Falling blocks. Clear lines, chase levels, hold a piece for later. Keyboard or touch." />
  <link rel="icon" href="icon-192.png" /><link rel="apple-touch-icon" href="icon-192.png" /><title>Blocks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
    <a id="btn-hub" class="hub-link" href="../">‹ Arcade</a>
    <div class="top"><div class="brand">Blocks</div><div class="scores"><div class="box"><small data-i18n="score">Score</small><b id="score">0</b></div><div class="box"><small data-i18n="level">Level</small><b id="level">1</b></div><div class="box"><small data-i18n="best">Best</small><b id="best">0</b></div></div></div>
    <div class="play"><div class="side"><small data-i18n="hold">Hold</small><canvas id="hold" width="120" height="120"></canvas></div><canvas id="cv" width="300" height="600"></canvas><div class="side"><small data-i18n="next">Next</small><canvas id="next" width="120" height="360"></canvas></div></div>
    <div class="pad"><button data-k="left">◀</button><button data-k="rot">⟳</button><button data-k="right">▶</button><button data-k="hold">H</button><button data-k="down">▼</button><button data-k="drop">⤓</button></div>
    <p class="hint" data-i18n="hint">← → move · ↑ rotate · ↓ soft drop · space hard drop · C hold. Swipe on touch.</p>
    <div id="over" class="overlay hidden"><div class="card"><h2 id="over-title"></h2><div id="over-score" class="big-num"></div><div id="over-rank" class="dim"></div><button id="btn-again" class="big" data-i18n="tryAgain">Try again</button></div></div>
    <div id="lb" class="overlay hidden"><div class="card"><h2 data-i18n="leaderboard">Leaderboard</h2><div class="name-row"><input id="name-input" maxlength="12" placeholder="Your name" data-i18n-ph="yourName" /><button id="btn-name">OK</button></div><div id="lb-status" class="dim"></div><ol id="lb-list"></ol><button id="lb-close" data-i18n="close">Close</button></div></div>
    <div class="foot"><button id="btn-lb" class="ghost" data-i18n="leaderboard">Leaderboard</button><button id="btn-sound" class="ghost"></button><button id="btn-lang" class="ghost"></button></div>
  </div>
  <script src="js/common.js"></script><script src="../rating.js"></script><script src="js/main.js"></script>
</body>
</html>
