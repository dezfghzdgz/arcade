<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" /><meta name="theme-color" content="#1B1030" />
  <meta name="description" content="Hop across roads, rivers and train tracks. How far can you get?" />
  <link rel="icon" href="icon-192.png" /><link rel="apple-touch-icon" href="icon-192.png" /><title>Hop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage" class="full">
    <a id="btn-hub" class="hub-link" href="../">‹ Arcade</a>
    <canvas id="cv" width="360" height="640"></canvas>
    <div id="start" class="overlay clear"><div class="card"><div class="brand">Hop</div><p class="dim" data-i18n="hint">Tap or ↑ to hop forward. Swipe or ← → ↓ to dodge.</p><div class="dim" id="start-best"></div><button id="btn-go" class="big" data-i18n="play">Play</button><button id="btn-lb" class="ghost" data-i18n="leaderboard">Leaderboard</button></div></div>
    <div id="over" class="overlay hidden"><div class="card"><h2 id="over-title"></h2><div id="over-score" class="big-num"></div><div id="over-rank" class="dim"></div><button id="btn-again" class="big" data-i18n="tryAgain">Try again</button><button id="btn-lb2" class="ghost" data-i18n="leaderboard">Leaderboard</button></div></div>
    <div id="lb" class="overlay hidden"><div class="card"><h2 data-i18n="leaderboard">Leaderboard</h2><div class="name-row"><input id="name-input" maxlength="12" placeholder="Your name" data-i18n-ph="yourName" /><button id="btn-name">OK</button></div><div id="lb-status" class="dim"></div><ol id="lb-list"></ol><button id="lb-close" data-i18n="close">Close</button></div></div>
    <div class="corner"><button id="btn-sound" class="ghost"></button><button id="btn-lang" class="ghost"></button></div>
  </div>
  <script src="js/common.js"></script><script src="../rating.js"></script><script src="js/main.js"></script>
</body>
</html>
